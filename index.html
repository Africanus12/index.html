<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReliabilityIQ Ventures — Links</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0f14;
    color: #f2f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  p.tag {
    color: #8a96a3;
    margin-top: 0;
    margin-bottom: 32px;
    font-size: 0.95rem;
  }
  .links {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.link {
    display: block;
    text-decoration: none;
    color: #f2f5f7;
    background: #151b23;
    border: 1px solid #232b35;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 1rem;
    font-weight: 500;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  a.link:hover {
    background: #1c2530;
    transform: translateY(-1px);
  }
  a.link span.label {
    display: block;
    font-size: 0.75rem;
    color: #8a96a3;
    font-weight: 400;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
  <h1>ReliabilityIQ Ventures</h1>
  <p class="tag">AI-powered information services &amp; automation</p>
  <div class="links">
    <a class="link" href="https://reliabilityiq.com/" target="_blank" rel="noopener">
      <span class="label">Website</span>
      reliabilityiq.com
    </a>
    <a class="link" href="https://www.instagram.com/reliabilityiqventures" target="_blank" rel="noopener">
      <span class="label">Instagram</span>
      @reliabilityiqventures
    </a>
    <a class="link" href="https://youtube.com/@reliabilityiq" target="_blank" rel="noopener">
      <span class="label">YouTube</span>
      @reliabilityiq
    </a>
  </div>
</body>
</html>
