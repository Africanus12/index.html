<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReliabilityIQ Ventures — Links</title>
<style>
  :root {
    --navy: #00558A;
    --teal: #00C0B6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    background: #061620;
    color: #f2f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px;
    position: relative;
  }

  /* Animated ambient background orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .orb-1 {
    width: 340px; height: 340px;
    background: var(--teal);
    top: -80px; left: -100px;
    animation: float1 14s ease-in-out infinite;
  }
  .orb-2 {
    width: 300px; height: 300px;
    background: var(--navy);
    bottom: -100px; right: -80px;
    animation: float2 16s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 60px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, -40px) scale(1.1); }
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .logo-wrap {
    animation: dropIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both, bob 5s ease-in-out 1.2s infinite;
    margin-bottom: 20px;
  }
  .logo {
    width: 88px;
    height: auto;
    display: block;
    filter: drop-shadow(0 4px 18px rgba(0, 192, 182, 0.4));
  }
  @keyframes dropIn {
    0% { opacity: 0; transform: translateY(-24px) scale(0.85); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--navy), var(--teal), var(--navy));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeUp 0.8s ease 0.15s both, shine 6s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  p.tag {
    color: #9db3bf;
    margin-top: 0;
    margin-bottom: 36px;
    font-size: 0.95rem;
    text-align: center;
    animation: fadeUp 0.8s ease 0.3s both;
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .links {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.link {
    position: relative;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #f2f6f8;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0, 192, 182, 0.25);
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 1rem;
    font-weight: 600;
    backdrop-filter: blur(6px);
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.7s ease forwards;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  a.link:nth-child(1) { animation-delay: 0.45s; }
  a.link:nth-child(2) { animation-delay: 0.6s; }
  a.link:nth-child(3) { animation-delay: 0.75s; }

  a.link::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--navy), var(--teal));
  }
  a.link::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.12), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }
  a.link:hover {
    transform: translateY(-3px);
    border-color: var(--teal);
    background: rgba(0, 192, 182, 0.08);
    box-shadow: 0 8px 24px rgba(0, 192, 182, 0.18);
  }
  a.link:hover::after {
    left: 120%;
  }
  a.link:active {
    transform: translateY(-1px) scale(0.99);
  }

  a.link span.label {
    display: block;
    font-size: 0.72rem;
    color: #7fa8ac;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 48px;
    font-size: 0.75rem;
    color: #4d6672;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.95s forwards;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
